<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivir Bien</title>
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Apunta al archivo real en disco: styles.css -->
    <link rel="stylesheet" href="styles.css">
</head>
<body id="app-body">

    <!-- ENCABEZADO -->
    <header>
        <h1>vivir bien</h1>
        <button id="btn-login-admin">admin</button>
    </header>

    <!-- BANNER Y TEXTO PRINCIPAL -->
    <section class="hero-section">
        <img src="https://via.placeholder.com/1000x250?text=Foto+editable+por+admin" alt="Banner Vivir Bien" id="display-banner-img">
        <div class="hero-content">
            <a href="https://www.livegood.com/internationalWellnessPack" target="_blank" class="official-link" id="display-official-link">
                https://www.livegood.com/internationalWellnessPack
            </a>
            <p id="display-vendor-text">ADQUIRÍ ESTE PACK EN TODO EL MUNDO A PRECIO DE FÁBRICA. Carga de combos e información oficial.</p>
        </div>
    </section>

    <!-- CONTENEDOR DINÁMICO DE PRODUCTOS -->
    <section class="productos-container" id="grid-productos">
        <!-- Se inyectan las publicaciones con app.js -->
    </section>

    <!-- MODAL CONFIGURACIÓN GENERAL DEL ADMIN -->
    <div class="modal" id="modal-admin">
        <div class="modal-content">
            <h2>Panel Admin - Vivir Bien</h2>
            
            <label for="input-banner">URL Foto de Banner:</label>
            <input type="text" id="input-banner" value="banner.jpg">
            
            <label for="input-link">Link de Página Oficial LiveGood:</label>
            <input type="text" id="input-link" value="https://www.livegood.com/internationalWellnessPack">
            
            <label for="input-text">Texto editable por vendedor:</label>
            <textarea id="input-text" rows="3">ADQUIRÍ ESTE PACK EN TODO EL MUNDO A PRECIO DE FÁBRICA.</textarea>
            
            <label for="input-wa">WhatsApp Consulta Vendedor (sin signo +):</label>
            <input type="text" id="input-wa" value="5493725449776">

            <div class="admin-actions">
                <button class="btn-cerrar" id="btn-cerrar-modal">Cerrar</button>
                <button class="btn-guardar" id="btn-guardar-config">Guardar</button>
            </div>
        </div>
    </div>

    <!-- PANEL LATERAL: AGREGAR PRODUCTO -->
    <div class="side-panel" id="panel-producto">
        <button class="close-side-panel" id="btn-cerrar-panel">&times;</button>
        <h2>Agregar Producto</h2>
        <br>
        <button class="btn-select-img">📸 Seleccionar foto</button>
        <input type="text" id="nuevo-titulo" placeholder="Título de la publicación">
        <button class="btn-whatsapp mt-10" id="btn-agregar-producto">Agregar Publicación</button>
    </div>

    <!-- Apunta al archivo real en disco: app.js -->
    <script src="app.js"></script>
</body>
</html>
